name: Bug report
description: Report a reproducible problem in OpsSentinel AI.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve OpsSentinel AI. Remove secrets and private logs before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the API with ...
        2. Submit ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
      placeholder: main or a commit SHA
  - type: input
    id: python
    attributes:
      label: Python and operating system
      placeholder: Python 3.12, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste only the smallest useful excerpt. Remove credentials, customer data, and internal URLs.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
