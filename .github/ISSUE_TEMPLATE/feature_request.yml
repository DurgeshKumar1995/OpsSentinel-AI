name: Feature request
description: Propose a focused improvement to the agent, tools, safety, or UI.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who has this problem, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the user flow and expected behavior.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and agent impact
      description: Describe permissions, tool side effects, data handling, token usage, and required evaluation coverage.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement this feature.
